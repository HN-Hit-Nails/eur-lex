# Diplomas portugueses a juntar além das medidas de transposição que o Cellar regista
# (o Cellar só regista transposição de diretivas; a execução de regulamentos fica de fora).
# Só entram aqui diplomas cuja relação com o acto da UE está confirmada numa fonte citada, ou
# diplomas nacionais pedidos expressamente pelo titular do repositório (o motivo fica na nota).

diplomas:
  - tipo: Lei
    numero: 58/2019
    data: '2019-08-08'
    relacionado_com: [32016R0679]
    nota: >-
      Assegura a execução, na ordem jurídica nacional, do RGPD (Regulamento (UE) 2016/679).
      Fonte da relação: aviso legal do próprio DRE (diariodarepublica.pt/dr/geral/avisos-legais),
      consultado em 2026-10-09.

  - tipo: Lei
    numero: 145/2015
    data: '2015-09-09'
    relacionado_com: []
    nota: >-
      Estatuto da Ordem dos Advogados: deveres deontológicos, incompatibilidades, publicidade,
      honorários e inscrição. Pedido pelo titular do repositório em 2026-10-10. Publicação
      indicada no portal da Ordem (portal.oa.pt/ordem/regras-profissionais/estatuto-da-ordem-dos-advogados):
      Diário da República, Série I, n.º 176, de 2015-09-09.

  - tipo: Decreto-Lei
    numero: 28/2019
    data: '2019-02-15'
    relacionado_com: [32006L0112, 32017L2455]
    nota: >-
      Regime da faturação: processamento de faturas e outros documentos fiscalmente relevantes,
      conservação de livros e registos, emissão de fatura por via eletrónica (artigo 12.º).
      Pedido pelo titular do repositório em 2026-10-19 (o diploma é citado no Código do IVA, na
      Lei n.º 2/2014, no Decreto-Lei n.º 123/2018 e na Portaria n.º 289/2019, mas não estava cá).
      Fonte da relação: o preâmbulo do próprio diploma, que acolhe o artigo 219.º-A da Diretiva
      2006/112/CE e transpõe a alínea 2) do artigo 1.º da Diretiva (UE) 2017/2455 (o Cellar não o
      regista como medida de transposição). Publicação: ELI data.dre.pt/eli/dec-lei/28/2019/02/15/p/dre.

  - tipo: Decreto-Lei
    numero: 156/2005
    data: '2005-09-15'
    relacionado_com: []
    nota: >-
      Livro de reclamações: obrigatoriedade de o disponibilizar a todos os fornecedores de bens ou
      prestadores de serviços que tenham contacto com o público em geral. Pedido pelo titular do
      repositório em 2026-10-24 (para o Belessa, que desenha os sites e o backoffice de clínicas).
      Diploma nacional, sem relação com um acto da UE confirmada numa fonte. Publicação: ELI
      data.dre.pt/eli/dec-lei/156/2005/09/15/p/dre.

  - tipo: Lei
    numero: 144/2015
    data: '2015-09-08'
    relacionado_com: [32013L0011]
    nota: >-
      Resolução alternativa de litígios de consumo. Pedido pelo titular do repositório em 2026-10-24
      (para o Belessa). O Cellar não regista nenhuma medida portuguesa de transposição da Diretiva
      2013/11/UE; fonte da relação: o sumário do próprio diploma no DRE («Transpõe a Diretiva
      2013/11/UE […] sobre a resolução alternativa de litígios de consumo»), consultado em
      2026-10-24. Publicação: ELI data.dre.pt/eli/lei/144/2015/09/08/p/dre.

  - tipo: Lei
    numero: 16/2022
    data: '2022-08-16'
    relacionado_com: [32018L1972]
    nota: >-
      Lei das Comunicações Eletrónicas. Pedido pelo titular do repositório em 2026-10-26 (para o
      Belessa). Fica fora das medidas de transposição deste repositório porque a Diretiva (UE)
      2018/1972 (Código Europeu das Comunicações Eletrónicas) não está em ferramentas/nucleo.yaml.
      Fonte da relação: o Cellar regista-a como medida portuguesa de transposição da Diretiva (UE)
      2018/1972 (medida 72018L1972PRT_202205359: «Lei n.º 16/2022, de 16 de agosto, que Aprova a
      Lei das Comunicações Eletrónicas, transpondo as Diretivas 98/84/CE, 2002/77/CE e (UE)
      2018/1972 […]»), consultado em 2026-10-26. Publicação: ELI data.dre.pt/eli/lei/16/2022/08/16/p/dre.

  - tipo: Decreto-Lei
    numero: 398/1998
    data: '1998-12-17'
    relacionado_com: []
    nota: >-
      Lei Geral Tributária (em anexo): âmbito do procedimento tributário (artigo 54.º) e contagem dos
      prazos (artigo 57.º, n.º 3, que remete para o artigo 279.º do Código Civil). Pedido pelo titular do
      repositório em 2026-10-26 (para o Belessa: os prazos do IVA em dia não útil). Diploma nacional, sem
      relação com um acto da UE confirmada numa fonte. Publicação: ELI data.dre.pt/eli/dec-lei/398/1998/12/17/p/dre.

  - tipo: Decreto-Lei
    numero: 433/1999
    data: '1999-10-26'
    relacionado_com: []
    nota: >-
      Código de Procedimento e de Processo Tributário (em anexo): contagem dos prazos do procedimento
      tributário, com o termo transferido para o primeiro dia útil seguinte quando os serviços estiverem
      encerrados (artigo 20.º, n.º 1), e âmbito do procedimento tributário (artigo 44.º). Pedido pelo titular
      do repositório em 2026-10-26 (para o Belessa: os prazos do IVA em dia não útil). Diploma nacional, sem
      relação com um acto da UE confirmada numa fonte. Publicação: ELI data.dre.pt/eli/dec-lei/433/1999/10/26/p/dre.
